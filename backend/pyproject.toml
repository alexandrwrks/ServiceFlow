[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn>=0.54.0",
    "loguru>=0.7.3",
    "argon2-cffi>=25.1.0",
    "redis>=8.1.0",
    "taskiq>=0.13.0",
    "taskiq-aio-pika>=0.6.1",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "aio-pika>=10.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
