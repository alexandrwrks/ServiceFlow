services:

  bot_db:
    image: postgres:17
    container_name: serviceflow_db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 3
    env_file:
      - .env.docker
    volumes:
      - bot_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  test_db:
    image: postgres:17
    container_name: serviceflow_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: service_flow_test
    ports:
      - "5434:5432"

volumes:
  bot_db_data: