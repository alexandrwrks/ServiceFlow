services:
  api_sf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: serviceflow_api
    restart: always
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db_sf:
        condition: service_healthy
      redis_sf:
        condition: service_healthy

  db_sf:
    image: postgres:17
    container_name: serviceflow_db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 3
    env_file:
      - .env.docker
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  test_db:
    image: postgres:17
    container_name: serviceflow_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: service_flow_test
    ports:
      - "5434:5432"

  redis_sf:
    image: redis:8-alpine
    container_name: redis_service_flow
    restart: always
    env_file:
      - .env.docker
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate_sf:
    build: .
    command: uv run alembic upgrade head
    env_file:
      - .env.docker
    depends_on:
      db_sf:
        condition: service_healthy

volumes:
  db_data: